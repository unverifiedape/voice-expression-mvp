<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050505" />
<title>今日高危发言榜｜RelationshipTest</title>
<style>
:root{--bg:#050505;--text:#f7f2ea;--muted:#8e8a83;--acid:#d7ff3f;--line:rgba(255,255,255,.1);--gold:#ffcf66;--danger:#ff4d4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#050505;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",Arial,sans-serif}.app{position:relative;max-width:520px;min-height:100dvh;margin:0 auto;padding:20px 18px calc(28px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% -8%,rgba(215,255,63,.18),transparent 34%),radial-gradient(circle at 8% 92%,rgba(143,216,255,.1),transparent 35%),#050505;overflow:hidden}.grain{pointer-events:none;position:absolute;inset:0;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E")}.content{position:relative;z-index:1}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.back{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:999px;padding:10px 13px;font-size:14px;font-weight:800}.pill{border:1px solid rgba(215,255,63,.24);background:rgba(215,255,63,.07);color:var(--acid);border-radius:999px;padding:10px 13px;font-size:13px;font-weight:900}.title{font-size:46px;line-height:.95;letter-spacing:-.07em;font-weight:950;margin:10px 0 10px}.sub{margin:0 0 22px;color:rgba(247,242,234,.58);font-size:15px;line-height:1.55}.list{display:grid;gap:12px}.item{position:relative;border:1px solid rgba(255,255,255,.11);background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035));border-radius:28px;padding:16px;box-shadow:0 18px 56px rgba(0,0,0,.38);overflow:hidden}.item:before{content:"";position:absolute;right:-54px;top:-54px;width:142px;height:142px;border-radius:50%;background:rgba(215,255,63,.1);filter:blur(16px)}.row{position:relative;display:flex;align-items:flex-start;gap:12px}.rank{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;background:rgba(215,255,63,.12);border:1px solid rgba(215,255,63,.22);color:var(--acid);font-weight:950}.main{flex:1;min-width:0}.score{font-size:42px;line-height:.9;font-weight:950;letter-spacing:-.08em;color:#fff}.type{display:inline-flex;margin:8px 0 10px;padding:6px 9px;border-radius:999px;background:rgba(215,255,63,.1);border:1px solid rgba(215,255,63,.22);color:var(--acid);font-size:12px;font-weight:900}.quote{font-size:20px;line-height:1.15;letter-spacing:-.045em;font-weight:950;margin:0 0 14px;color:#fff8e8}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.play,.open{border:0;border-radius:16px;padding:13px 10px;font-size:14px;font-weight:950}.play{background:var(--acid);color:#080808}.open{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--line)}.empty{border:1px dashed rgba(255,255,255,.18);border-radius:28px;padding:24px;text-align:center;color:var(--muted);line-height:1.6;background:rgba(255,255,255,.035)}.cta{display:block;text-align:center;margin:18px 0 0;border:0;border-radius:20px;padding:16px;background:var(--acid);color:#080808;font-size:16px;font-weight:950;text-decoration:none}.toast{position:fixed;left:18px;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));max-width:484px;margin:0 auto;padding:14px 16px;background:rgba(247,242,234,.94);color:#090909;border-radius:18px;font-weight:900;text-align:center;opacity:0;transform:translateY(12px);transition:.25s;z-index:10}.toast.show{opacity:1;transform:none}.hint{font-size:12px;color:rgba(247,242,234,.38);line-height:1.45;text-align:center;margin:16px 0 0}@media(max-width:380px){.title{font-size:40px}.quote{font-size:18px}.score{font-size:36px}}

/* V1.7.2 unified ranking */
.title{margin-top:18px}
.sub{font-weight:700;color:rgba(247,242,234,.62)}
.item{border-radius:30px;padding:18px}
.quote{margin-top:2px;margin-bottom:16px}
.play{font-size:15px;border-radius:18px;padding:15px 10px}
.open{font-size:15px;border-radius:18px;padding:15px 10px;opacity:.86}
</style>
</head>
<body>
<main class="app">
  <div class="grain"></div>
  <div class="content">
    <div class="top"><button class="back" onclick="location.href='/'">← 返回测试</button><div class="pill">偷听模式</div></div>
    <h1 class="title">今日高危<br>发言榜</h1>
    <p class="sub">这些话，真的有人说出口了。<br>点开听听，哪一句最让人沉默。</p>
    <section class="list" id="list"><div class="empty">正在读取高危发言…</div></section>
    <a class="cta" href="/">我也说一句</a>
    <p class="hint">娱乐测试，不代表真实人格判断。请不要公开传播他人隐私内容。</p>
  </div>
  <div class="toast" id="toast"></div>
</main>
<audio id="player" playsinline></audio>
<script>
const $=id=>document.getElementById(id);let currentId='',items=[];
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1900)}
function track(event,data={}){try{fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event,data,path:location.pathname,sid:data.sid||''}),keepalive:true});}catch(e){}}
function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){const list=$('list');if(!items.length){list.innerHTML='<div class="empty">今天还没有足够的高危原声。<br>先说一句，让榜单热起来。</div>';return}list.innerHTML=items.map((it,i)=>`<article class="item"><div class="row"><div class="rank">#${i+1}</div><div class="main"><div class="score">${it.score||88}%</div><div class="type">${esc(it.type||'☣️ 高危发言')}</div><p class="quote">${esc(it.quote||'这句话不一定很重，但很容易让人不舒服')}</p><div class="actions"><button class="play" data-id="${esc(it.id)}" data-url="${esc(it.audio_url)}">▶ 听听这句话</button><button class="open" data-url="${esc(it.share_url)}">看完整结果</button></div></div></div></article>`).join('');}
async function load(){track('ranking_view');try{const r=await fetch('/api/ranking?limit=50',{cache:'no-store'});const data=await r.json();items=(data.items||[]);render();}catch(e){$('list').innerHTML='<div class="empty">榜单暂时加载失败。<br>先返回首页测一次。</div>';}}
document.addEventListener('click',async e=>{const play=e.target.closest('.play');if(play){const id=play.dataset.id,url=play.dataset.url;const a=$('player');if(currentId===id&&!a.paused){a.pause();play.textContent='▶ 听听这句话';return}document.querySelectorAll('.play').forEach(b=>b.textContent='▶ 听听这句话');currentId=id;a.src=url;try{await a.play();play.textContent='暂停播放';track('ranking_audio_play_click',{sid:id});}catch(err){toast('请再点一次播放')}}const open=e.target.closest('.open');if(open){track('ranking_share_open_click',{url:open.dataset.url});location.href=open.dataset.url;}});
$('player').addEventListener('ended',()=>{document.querySelectorAll('.play').forEach(b=>b.textContent='▶ 听听这句话');currentId=''});
load();
</script>
</body>
</html>
