<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毒气测试</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont;
    background: #f7f7f7;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 480px;
    margin: auto;
}

h1 {
    font-size: 28px;
    margin-bottom: 10px;
}

.subtitle {
    color: #666;
    margin-bottom: 20px;
}

.test-box {
    background: #fff;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.quote {
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    margin: 20px 0;
}

.options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.option {
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid #ddd;
    cursor: pointer;
}

.option.active {
    border: 2px solid #4a7c59;
    color: #4a7c59;
}

.record-section {
    margin-top: 20px;
}

.record-tip {
    color: #888;
    margin-bottom: 10px;
}

button {
    width: 48%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
}

.btn-primary {
    background: #4a7c59;
    color: white;
}

.btn-secondary {
    background: #eee;
}

.result {
    background: #fff;
    padding: 16px;
    border-radius: 12px;
    margin-top: 20px;
}

.score {
    font-size: 32px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

    <h1>毒气测试</h1>

    <div class="subtitle">
        同一句话，你说出来就变了味。
    </div>

    <div class="test-box">

        <div class="quote">
            “你开心就好。”
        </div>

        <div class="options">
            <div class="option active">你开心就好。</div>
            <div class="option">没关系，你忙你的。</div>
            <div class="option">都行，我无所谓。</div>
            <div class="option">好的，我知道了。</div>
            <div class="option">行啊，随你。</div>
        </div>

        <div class="record-section">

            <div class="record-tip">
                读一句就行，很简单。
            </div>

            <div class="record-tip">
                读上面那句话
            </div>

            <button class="btn-primary" onclick="startRecording()">说一句试试</button>
            <button class="btn-secondary" onclick="stopRecording()">停止并分析</button>

        </div>

    </div>

    <div class="result" id="resultBox" style="display:none;">
        <div class="score">毒气指数：86</div>
        <p>话不对味，语气有毒。</p>
    </div>

</div>

<script>
// keep existing logic intact
</script>

</body>
</html>
