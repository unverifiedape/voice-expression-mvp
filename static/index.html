<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毒气测试</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont;background:#f5f6f7;margin:0;padding:16px;}
.container{max-width:420px;margin:auto;}
.title{font-size:28px;font-weight:700;}
.subtitle{color:#666;margin-top:6px;line-height:1.5;}
.card{background:#fff;border-radius:18px;padding:16px;margin-top:16px;}
.quote{font-size:22px;font-weight:600;text-align:center;padding:12px;background:#f1f3f4;border-radius:12px;}
.btn-group{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
.btn{padding:10px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;}
.btn.active{border:2px solid #2e7d32;color:#2e7d32;}
.record-card{text-align:center;margin-top:20px;padding:20px;border-radius:18px;background:#f9fafb;}
.mic{width:80px;height:80px;border-radius:50%;background:#2e7d32;color:#fff;display:flex;align-items:center;justify-content:center;margin:auto;font-size:30px;}
.record-btn{margin-top:12px;background:#2e7d32;color:#fff;border:none;padding:14px;border-radius:12px;width:100%;}
.score{font-size:36px;font-weight:700;}
.badge{background:#e6f4ea;color:#2e7d32;padding:4px 10px;border-radius:12px;font-size:12px;margin-left:8px;}
.elements{margin-top:10px;color:#444;}
.verdict{margin-top:20px;}
.verdict-title{color:#c44;font-size:12px;letter-spacing:1px;}
.verdict-main{font-size:26px;font-weight:700;margin-top:8px;}
.share-card{margin-top:20px;background:#111;color:#fff;padding:16px;border-radius:18px;}
.audio-bar{margin:10px 0;height:30px;background:#333;border-radius:8px;}
.qr{width:80px;height:80px;background:#fff;float:right;}
.actions{display:flex;gap:10px;margin-top:10px;}
.actions button{flex:1;padding:12px;border-radius:10px;border:none;}
.primary{background:#2e7d32;color:#fff;}
</style>
</head>
<body>
<div class="container">

<div class="card">
<div class="title">毒气测试</div>
<div class="subtitle">
你说话其实挺有毒的。<br>
同一句话，你说出来就变了味。
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;font-size:12px;color:#888">
<span>试试这句</span>
<span>换一句</span>
</div>

<div class="quote">“你开心就好。”</div>

<div class="btn-group">
<div class="btn active">你开心就好</div>
<div class="btn">没关系，你忙你的</div>
<div class="btn">都行，我无所谓</div>
<div class="btn">好的，我知道了</div>
<div class="btn">行啊，随你</div>
</div>
</div>

<div class="record-card">
<div style="color:#666;margin-bottom:10px">读一句就行，很简单</div>
<div class="mic">🎤</div>
<button class="record-btn">按住说一句</button>
</div>
</div>

<div class="card">
<div class="score">
毒气指数：71
<span class="badge">有点毒</span>
</div>

<div style="color:#666;margin-top:6px">
话不对味，语气有毒。
</div>

<div class="elements">
检测到的毒气：<br>
二氧化硫 · 氯气 · 表达含糊 · 臭鸡蛋味
</div>

<div class="verdict">
<div class="verdict-title">SYSTEM VERDICT</div>
<div class="verdict-main">
你不是在试探，你是在把不确定甩给别人消化。
</div>
</div>

<div class="share-card">
<div style="font-size:18px;font-weight:600">
它说我让人猜得累，你认不认？
</div>
<div class="audio-bar"></div>
<div>毒气指数：71</div>
<div style="margin-top:8px">臭鸡蛋味 · 情绪悬浮物</div>
<div class="qr"></div>
<div style="margin-top:8px;font-size:12px;color:#aaa">
扫码你也说一句
</div>
</div>

<div class="actions">
<button>生成毒气卡</button>
<button class="primary">分享给朋友</button>
</div>
</div>

</div>
</body>
</html>
