<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>一句话语音判词</title>
  <style>
    :root {
      --bg: #f3f3f1;
      --card: #ffffff;
      --text: #121212;
      --muted: #666;
      --line: #e6e6e2;
      --danger: #d3362d;
      --soft: #f8f8f6;
      --black: #0d0d0d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",sans-serif; }
    .wrap { max-width: 780px; margin: 0 auto; padding: 18px 14px 42px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 28px; padding: 22px 18px; margin-bottom: 18px; }
    h1 { margin: 0 0 10px; font-size: 30px; line-height: 1.15; letter-spacing: -0.03em; }
    .desc { color: var(--muted); font-size: 15px; line-height: 1.8; margin-bottom: 16px; }
    .challenge-banner { display: none; margin-bottom: 12px; padding: 12px 14px; border-radius: 16px; background: #111; color: #fff; font-size: 14px; line-height: 1.7; }
    .sentence-box { background: var(--soft); border: 1px solid var(--line); border-radius: 22px; padding: 18px 16px; text-align: center; font-size: 28px; line-height: 1.28; margin-bottom: 14px; font-weight: 700; }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 10px 14px; font-size: 14px; cursor: pointer; }
    .chip.active { border-color: #1f4a38; box-shadow: inset 0 0 0 1px #1f4a38; color: #1f4a38; font-weight: 700; }
    .tips { border: 1px dashed var(--line); border-radius: 18px; padding: 14px; color: var(--muted); line-height: 1.75; font-size: 14px; background: #fafaf8; }
    .section-title { margin: 0 0 14px; font-size: 22px; font-weight: 900; }
    .controls { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    button { border: none; border-radius: 18px; padding: 16px 22px; font-size: 15px; cursor: pointer; }
    .btn-primary { background: #55745f; color: white; }
    .btn-secondary { background: #ececea; color: #555; }
    .btn-danger { background: var(--black); color: white; }
    .status { min-height: 22px; color: var(--muted); font-size: 14px; margin-bottom: 8px; }
    .error { color: var(--danger); font-size: 14px; line-height: 1.7; margin-top: 8px; white-space: pre-wrap; }
    audio { width: 100%; margin-top: 8px; }
    .result { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 18px; }
    .badge { display: inline-block; font-size: 12px; letter-spacing: 0.08em; color: var(--danger); margin-bottom: 12px; font-weight: 800; text-transform: uppercase; }
    .result-sentence { font-size: 24px; line-height: 1.35; font-weight: 800; margin-bottom: 20px; }
    .result-title { font-size: 34px; line-height: 1.2; font-weight: 900; margin: 0 0 16px; letter-spacing: -0.04em; }
    .result-sub { font-size: 16px; line-height: 1.85; color: #444; margin-bottom: 24px; }
    .consequences { margin-bottom: 18px; }
    .list-title { font-size: 14px; font-weight: 900; margin-bottom: 8px; }
    .consequences ul { margin: 0; padding-left: 24px; line-height: 1.95; color: #2b2b2b; font-size: 15px; }
    .challenge-box { background: #050505; color: #fff; border-radius: 22px; padding: 18px 16px; margin-top: 16px; position: relative; overflow: hidden; }
    .challenge-label { font-size: 12px; opacity: 0.72; margin-bottom: 8px; letter-spacing: 0.08em; text-transform: uppercase; }
    .challenge-text { font-size: 30px; line-height: 1.26; font-weight: 900; letter-spacing: -0.03em; margin-bottom: 10px; max-width: 72%; }
    .challenge-sub { font-size: 14px; color: rgba(255,255,255,0.78); line-height: 1.7; max-width: 72%; }
    .challenge-qr { position: absolute; right: 16px; bottom: 16px; width: 110px; height: 110px; background: #ecece8; border-radius: 6px; object-fit: cover; }
    .share-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .note { margin-top: 10px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    canvas { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>一句话语音判词</h1>
      <div class="desc">读同一句话。我们不判断内容真假，只判断你说出来时，更像在把什么感觉甩给别人。</div>
      <div id="challengeBanner" class="challenge-banner">有人把这句话发给你，想听你怎么说。</div>
      <div id="sentenceBox" class="sentence-box">“你开心就好。”</div>
      <div class="chips" id="chips">
        <button class="chip active" data-sentence="你开心就好。">你开心就好。</button>
        <button class="chip" data-sentence="没关系，你忙你的。">没关系，你忙你的。</button>
        <button class="chip" data-sentence="都行，我无所谓。">都行，我无所谓。</button>
        <button class="chip" data-sentence="好的，我知道了。">好的，我知道了。</button>
        <button class="chip" data-sentence="行啊，随你。">行啊，随你。</button>
      </div>
      <div class="tips">建议在安静环境录音，完整读出一句。这个版本的重点不是“证明你是谁”，而是看系统会怎么判你。</div>
    </div>

    <div class="card">
      <div class="section-title">录音</div>
      <div class="controls">
        <button id="startBtn" class="btn-primary">开始录音</button>
        <button id="stopBtn" class="btn-secondary" disabled>停止并分析</button>
      </div>
      <div id="status" class="status">等待录音</div>
      <audio id="audioPlayer" controls style="display:none;"></audio>
      <div id="error" class="error"></div>

      <div id="result" class="result" style="display:none;">
        <div class="badge">SYSTEM VERDICT</div>
        <div id="resultSentence" class="result-sentence"></div>
        <div id="resultTitle" class="result-title"></div>
        <div id="resultSub" class="result-sub"></div>

        <div class="consequences">
          <div class="list-title">别人可能会怎么感受</div>
          <ul id="consequenceList"></ul>
        </div>

        <div class="challenge-box">
          <div class="challenge-label">拿去问别人</div>
          <div id="challengeText" class="challenge-text"></div>
          <div class="challenge-sub">别解释，直接发出去，让别人给你一个说法。</div>
          <img id="liveQr" class="challenge-qr" src="" alt="挑战二维码" />
        </div>

        <div class="share-actions">
          <button id="generateCardBtn" class="btn-danger">生成判决卡</button>
          <button id="copyLinkBtn" class="btn-secondary">复制挑战链接</button>
        </div>

        <div class="note">传播最有效的方式不是“来试试”，而是“你怎么说”。</div>
      </div>
    </div>
  </div>

  <canvas id="shareCanvas" width="1080" height="1350"></canvas>

  <script>
    const sentenceBox = document.getElementById("sentenceBox");
    const chips = document.querySelectorAll(".chip");
    const challengeBanner = document.getElementById("challengeBanner");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const audioPlayer = document.getElementById("audioPlayer");
    const resultEl = document.getElementById("result");
    const resultSentenceEl = document.getElementById("resultSentence");
    const resultTitleEl = document.getElementById("resultTitle");
    const resultSubEl = document.getElementById("resultSub");
    const consequenceListEl = document.getElementById("consequenceList");
    const challengeTextEl = document.getElementById("challengeText");
    const liveQrEl = document.getElementById("liveQr");
    const generateCardBtn = document.getElementById("generateCardBtn");
    const copyLinkBtn = document.getElementById("copyLinkBtn");

    let mediaRecorder = null;
    let mediaStream = null;
    let chunks = [];
    let selectedSentence = "你开心就好。";
    let latestCardData = null;

    const urlParams = new URLSearchParams(window.location.search);
    const challengeSentence = urlParams.get("challenge");

    const verdictMap = {
      "热情外放型": {
        title: "你说话最伤人的地方，不是凶，是逼人接情绪。",
        sub: "系统没有把你判成“热情”，而是更像一种会逼别人马上接住你状态的说法。你自己听可能觉得自然，别人未必会这么轻松。",
        consequences: [
          "别人可能会觉得你希望TA立刻给反应",
          "会被误听成：你不是在说话，你是在推动对方表态",
          "情绪存在感太强时，容易让人先防御，再沟通"
        ],
        challengePool: [
          "它说我总是用力过猛，你怎么说？",
          "它说我说话会给人压力，你认吗？",
          "它说我不是在沟通，是在逼人表态，你觉得像吗？"
        ]
      },
      "冷静控制型": {
        title: "你不是冷静，你是在把情绪藏起来控场。",
        sub: "系统更像在说：你表面不吵不闹，但你说话的方式会让别人下意识收住真实反应，因为节奏已经被你拿走了。",
        consequences: [
          "别人可能会觉得你不是真的在讨论，而是在控场",
          "你越稳，越容易被误读成：已经有结论了",
          "这种表达最容易让人觉得自己没有太多空间"
        ],
        challengePool: [
          "它说我说话很像在控场，你认吗？",
          "它说我不是冷静，是控制，你觉得过分吗？",
          "它说我一稳下来，别人就不太敢说真话，你认不认？"
        ]
      },
      "试探犹豫型": {
        title: "你不是在试探，你是在把不确定甩给别人消化。",
        sub: "系统会把这类说法理解成：你没有明说，但你把情绪停顿和犹豫感交给对方去猜。这种感觉很容易让人累。",
        consequences: [
          "别人可能会觉得要不停猜你到底是什么意思",
          "停顿太多时，会被误听成你在等别人先让步",
          "模糊表达本身就是一种压力"
        ],
        challengePool: [
          "它说我总把不确定丢给别人，你认不认？",
          "它说我不是含蓄，是让人猜得累，你怎么看？",
          "它说我每次都不说透，只把压力留给别人，像吗？"
        ]
      },
      "直接强势型": {
        title: "你不是直接，你是让人很难不顺着你说。",
        sub: "系统不会把这类语气听成爽快，反而更像一种边界太硬、让别人很难轻松回应的推进方式。",
        consequences: [
          "别人可能会觉得你不是在沟通，而是在定方向",
          "语气太利落时，容易让人下意识先退一步",
          "这种说法最容易被听成“我最好别反着来”"
        ],
        challengePool: [
          "它说我一开口就给人压力，你敢说不像？",
          "它说我不是直接，是压人，你觉得呢？",
          "它说我说话让人很难反驳，你认吗？"
        ]
      },
      "平稳克制型": {
        title: "你不是平和，你是在把情绪压得太干净了。",
        sub: "系统给你的不是“成熟”，而更像一种压得太平、平到别人不知道你真正站在哪边的表达方式。",
        consequences: [
          "别人可能会觉得你看似好说话，其实很难判断真实态度",
          "太平的说法容易被听成疏离，或者根本不想聊",
          "没有波动并不等于没有压迫感"
        ],
        challengePool: [
          "它说我说话有点太收着了，你觉得离谱吗？",
          "它说我表面平和，其实让人摸不清态度，你认吗？",
          "它说我不是温和，是让人觉得有点远，你怎么看？"
        ]
      }
    };

    function getVerdict(label) {
      const base = verdictMap[label] || {
        title: "你说出来的感觉，和你以为的不太一样。",
        sub: "系统觉得你这句话里带着一点你自己未必会承认的推动感，所以这个结果更适合拿去问别人，而不是自己闷着看。",
        consequences: [
          "别人不一定按你的自我理解来接收",
          "你以为自然的地方，别人可能会觉得不太舒服",
          "这种偏差本身就值得拿去问熟人"
        ],
        challengePool: [
          "它说我说话让人不太舒服，你怎么说？",
          "它说我自己觉得正常，别人未必舒服，你认吗？"
        ]
      };
      const challenge = base.challengePool[Math.floor(Math.random() * base.challengePool.length)];
      return { ...base, challenge };
    }

    function buildChallengeUrl(sentence) {
      return `${window.location.origin}/?challenge=${encodeURIComponent(sentence)}`;
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    if (challengeSentence) {
      selectedSentence = challengeSentence;
      sentenceBox.textContent = `“${selectedSentence}”`;
      challengeBanner.style.display = "block";
      chips.forEach((chip) => {
        if (chip.dataset.sentence === challengeSentence) {
          chips.forEach((c) => c.classList.remove("active"));
          chip.classList.add("active");
        } else {
          chip.classList.remove("active");
        }
      });
      statusEl.textContent = "你正在挑战别人发来的同一句话。";
    }

    chips.forEach((chip) => {
      chip.addEventListener("click", () => {
        chips.forEach((c) => c.classList.remove("active"));
        chip.classList.add("active");
        selectedSentence = chip.dataset.sentence;
        sentenceBox.textContent = `“${selectedSentence}”`;
      });
    });

    startBtn.addEventListener("click", async () => {
      errorEl.textContent = "";
      resultEl.style.display = "none";
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = [];
        mediaRecorder = new MediaRecorder(mediaStream);

        mediaRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size > 0) chunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
          try {
            statusEl.textContent = "正在生成判词...";
            const blob = new Blob(chunks, { type: "audio/webm" });
            const url = URL.createObjectURL(blob);
            audioPlayer.src = url;
            audioPlayer.style.display = "block";

            const formData = new FormData();
            formData.append("file", blob, "recording.webm");
            formData.append("sentence", selectedSentence);

            const resp = await fetch("/api/analyze", {
              method: "POST",
              body: formData
            });

            const data = await resp.json();
            if (!data.ok) throw new Error(data.error || "分析失败");

            const label = data.result.label;
            const verdict = getVerdict(label);
            const challengeUrl = buildChallengeUrl(selectedSentence);

            latestCardData = {
              sentence: selectedSentence,
              title: verdict.title,
              sub: verdict.sub,
              consequences: verdict.consequences,
              challenge: verdict.challenge,
              url: challengeUrl
            };

            resultSentenceEl.textContent = `“${selectedSentence}”`;
            resultTitleEl.textContent = verdict.title;
            resultSubEl.textContent = verdict.sub;
            challengeTextEl.textContent = verdict.challenge;
            liveQrEl.src = `/qr?url=${encodeURIComponent(challengeUrl)}`;

            consequenceListEl.innerHTML = "";
            verdict.consequences.forEach((text) => {
              const li = document.createElement("li");
              li.textContent = text;
              consequenceListEl.appendChild(li);
            });

            resultEl.style.display = "block";
            statusEl.textContent = "判词已生成";
          } catch (err) {
            statusEl.textContent = "分析失败";
            errorEl.textContent = String(err.message || err);
          } finally {
            if (mediaStream) mediaStream.getTracks().forEach((t) => t.stop());
            startBtn.disabled = false;
            stopBtn.disabled = true;
          }
        };

        mediaRecorder.start();
        statusEl.textContent = "录音中...";
        startBtn.disabled = true;
        stopBtn.disabled = false;
      } catch (err) {
        errorEl.textContent = "无法打开麦克风，请检查浏览器权限。";
      }
    });

    stopBtn.addEventListener("click", () => {
      if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
      statusEl.textContent = "录音结束，正在分析...";
    });

    copyLinkBtn.addEventListener("click", async () => {
      try {
        const challengeUrl = buildChallengeUrl(selectedSentence);
        await navigator.clipboard.writeText(challengeUrl);
        alert("挑战链接已复制");
      } catch (e) {
        alert("复制失败，请手动复制地址");
      }
    });

    generateCardBtn.addEventListener("click", async () => {
      if (!latestCardData) return;

      const canvas = document.getElementById("shareCanvas");
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;

      ctx.fillStyle = "#f3f3f1";
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = "#ffffff";
      roundRect(ctx, 54, 54, w - 108, h - 108, 36);
      ctx.fill();

      ctx.fillStyle = "#d3362d";
      ctx.font = "bold 26px sans-serif";
      ctx.fillText("SYSTEM VERDICT", 96, 124);

      ctx.fillStyle = "#111111";
      ctx.font = "bold 58px sans-serif";
      wrapText(ctx, `“${latestCardData.sentence}”`, 96, 210, w - 192, 68);

      ctx.fillStyle = "#111111";
      ctx.font = "bold 62px sans-serif";
      wrapText(ctx, latestCardData.title, 96, 390, w - 192, 74);

      ctx.fillStyle = "#505050";
      ctx.font = "30px sans-serif";
      wrapText(ctx, latestCardData.sub, 96, 680, w - 192, 46);

      ctx.fillStyle = "#111111";
      ctx.font = "bold 26px sans-serif";
      ctx.fillText("别人可能会怎么感受", 96, 870);

      ctx.fillStyle = "#333333";
      ctx.font = "28px sans-serif";
      let y = 930;
      latestCardData.consequences.forEach((item) => {
        wrapText(ctx, `• ${item}`, 110, y, w - 250, 42);
        y += 74;
      });

      ctx.fillStyle = "#050505";
      roundRect(ctx, 78, 1080, w - 156, 170, 26);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 44px sans-serif";
      wrapText(ctx, latestCardData.challenge, 110, 1148, w - 420, 56);

      ctx.fillStyle = "#ffffff";
      ctx.font = "24px sans-serif";
      ctx.fillText("扫码或打开链接测同一句话", 110, 1225);

      const qrUrl = `/qr?url=${encodeURIComponent(latestCardData.url)}`;
      try {
        const qrImg = await loadImage(qrUrl);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(w - 290, 1105, 150, 150);
        ctx.drawImage(qrImg, w - 290, 1105, 150, 150);
      } catch (e) {
        ctx.fillStyle = "#ecece8";
        ctx.fillRect(w - 290, 1105, 150, 150);
        ctx.fillStyle = "#999999";
        ctx.font = "24px sans-serif";
        ctx.fillText("QR", w - 236, 1190);
      }

      ctx.fillStyle = "#111111";
      ctx.font = "22px sans-serif";
      wrapText(ctx, latestCardData.url, 96, 1305, w - 192, 30);

      const link = document.createElement("a");
      link.download = "verdict-card.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const chars = text.split("");
      let line = "";
      for (let i = 0; i < chars.length; i++) {
        const testLine = line + chars[i];
        if (ctx.measureText(testLine).width > maxWidth && line) {
          ctx.fillText(line, x, y);
          line = chars[i];
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      if (line) ctx.fillText(line, x, y);
    }
  </script>
</body>
</html>
