<script>
const $=id=>document.getElementById(id);const screens=['homeScreen','scanScreen','resultScreen'];

const COMPONENTS=[
  '阴阳怪气残留（持续挥发中）','已读不回蒸汽（高温冷处理）','嘴硬保护膜（厚度超标）','礼貌性降温剂（表面文明）','不想解释沉淀物（沉底多年）','被动攻击微粒（肉眼难见）','空气变冷因子（扩散速度快）','轻微翻白眼粉尘（随语气飘散）','不耐烦挥发物（开口即散）','隐藏嫌弃颗粒（浓度稳定）','情绪压缩装置（随时漏气）','冷处理扩散物（半径三米）','社交疲惫气溶胶（吸入即沉默）','选择性耐心残渣（仅对少数人有效）','低频烦躁信号（持续发射）','强忍不爽压缩包（即将解压）','表面平静涂层（内含爆炸物）','内心翻桌粉尘（轻拍即起）','假装配合粉尘（伪装良好）','沉默式反击分子（毒性慢热）','冷笑残留液（附着力极强）','句尾带刺结晶（不易察觉）','好好说话抗体缺失（建议隔离）','群聊退潮素（使热场瞬间降温）','解释越多越毒反应剂（遇水加剧）'
];
const PCTS=[['37%','29%','18%'],['34%','25%','21%'],['31%','27%','19%'],['39%','22%','17%'],['35%','30%','16%']];
let mediaRecorder,chunks=[],audioBlob=null,audioUrl='',serverAudioUrl='',result=null,recordStarted=0,isRecording=false,shareId='',shareReady=false,uploadPromise=null;
let preparedStream=null,preparingMic=null,holdRequested=false,stopRequested=false;

function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');

  a.download=filename||'relationshiptest-share-card.png';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1200);
}
function fetchWithTimeout(url,options={},timeout=12000){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),timeout);
  return fetch(url,{...options,signal:ctrl.signal}).finally(()=>clearTimeout(timer));
}
function seedScore(){return Math.floor(72+Math.random()*21)}
function rand(arr){return arr[Math.floor(Math.random()*arr.length)]}
function sample(arr,n){const copy=[...arr],out=[];while(out.length<n&&copy.length){out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0])}return out}
function generateResult(score){return{score,type:rand(TYPES),quote:rand(LINES),ings:sample(COMPONENTS,3),pcts:rand(PCTS)}}
function fallbackByScore(score){const level=score>=84?'📴 群聊终结者':score>=76?'🧊 冷场制造机':score>=68?'⚡ 隐性放电型':'☣️ 语气污染源';return{score,type:level,quote:rand(LINES),ings:sample(COMPONENTS,3),pcts:rand(PCTS)}}
function makeBars(){let html='';for(let i=0;i<28;i++)html+=`<div class="bar" style="height:${20+Math.random()*70}px"></div>`;$('wave').innerHTML=html}makeBars();
async function prepareMic(silent=false){
  if(preparedStream && preparedStream.getAudioTracks().some(t=>t.readyState==='live')) return preparedStream;
  if(preparingMic) return preparingMic;
  if(!window.isSecureContext){ if(!silent) toast('麦克风需要 HTTPS 或 localhost 环境'); throw new Error('insecure context') }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ if(!silent) toast('当前浏览器无法调用麦克风'); throw new Error('no mediaDevices') }
  preparingMic=navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    preparedStream=stream; preparingMic=null; return stream;
  }).catch(e=>{preparingMic=null; if(!silent) toast('请允许麦克风权限后再试'); throw e});
  return preparingMic;
}
async function startRec(){
  try{
    if(isRecording)return;
    stopRequested=false;
    $('recordBtn').classList.add('recording');
    $('holdText').textContent='麦克风启动中，看到提示后再说';
    const stream=await prepareMic(false);
    if(!holdRequested){
      $('recordBtn').classList.remove('recording');
      $('holdText').textContent='麦克风已准备好，按住再说一句';
      toast('麦克风已准备好，重新按住开始录音');
      return;
    }
    chunks=[];
    const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':(MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'');
    mediaRecorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
    mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    mediaRecorder.onstop=()=>{isRecording=false;finishRec()};
    recordStarted=Date.now();
    mediaRecorder.start(120);
    isRecording=true;
    $('holdText').textContent='正在录音，松手看结果';
    toast('开始录音了，大胆说');

	}

		offset++;

	for (var i = 0; i < num.length - offset; i++) {

                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&

  const count=qr.getModuleCount();
  const quiet=4;
  const cell=size/(count+quiet*2);
  ctx.save();
  ctx.fillStyle='#fff';
  ctx.fillRect(x,y,size,size);
  ctx.fillStyle='#000';
  for(let r=0;r<count;r++){
    for(let col=0;col<count;col++){
      if(qr.isDark(r,col)){
        const px=x+(col+quiet)*cell;
        const py=y+(r+quiet)*cell;
        ctx.fillRect(Math.floor(px),Math.floor(py),Math.ceil(cell)+0.35,Math.ceil(cell)+0.35);
      }
    }
  }
  ctx.restore();
}

function canvasToBlobSafe(canvas){
  return new Promise((resolve,reject)=>{
    try{
      canvas.toBlob(b=>{
        if(b){resolve(b);return;}
        try{
          const dataUrl=canvas.toDataURL('image/png');
          const bin=atob(dataUrl.split(',')[1]);
          const arr=new Uint8Array(bin.length);
          for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
          resolve(new Blob([arr],{type:'image/png'}));
        }catch(e){reject(e)}
      },'image/png');
    }catch(e){reject(e)}
  });
}

function posterHeadlineLines(t){
  t=String(t||'你一解释，别人更想撤退').trim();
  const targets=['别人更想撤退','别人就想结束对话','听起来最有事','场面只剩礼貌','所有人都不敢接话','不敢接话','更想撤退','结束对话'];
  for(const k of targets){const i=t.indexOf(k);if(i>0){let a=t.slice(0,i);if(!/[，,。！？!?]$/.test(a))a+='，';return [a,t.slice(i)]}}
  if(t.includes('，')){const a=t.split(/[，,]/);return [a[0]+'，',a.slice(1).join('，')]}
  if(t.length>12)return [t.slice(0,Math.ceil(t.length/2)),t.slice(Math.ceil(t.length/2))];
  return [t,''];
}

function fitText(c,text,x,y,maxWidth,baseSize,weight='950'){
  text=String(text||'');
  let size=baseSize;
  const family='Arial, sans-serif';
  while(size>18){c.font=`${weight} ${size}px ${family}`;if(c.measureText(text).width<=maxWidth)break;size-=2;}
  c.fillText(text,x,y);
}


function drawStrongHazardBand(c,x,y,w,h,text){
  c.save();
  // strong reference-2 caution tape, but safe centered text
  c.fillStyle='#f0c22a';c.fillRect(x,y,w,h);
  c.save();c.globalAlpha=.20;c.fillStyle='#050505';
  for(let i=0;i<360;i++){c.fillRect(x+Math.random()*w,y+Math.random()*h,Math.random()*12,Math.random()*5)}
  c.restore();
  c.fillStyle='#050505';
  const stripeH=30;
  for(const yy of [y,y+h-stripeH]){
    for(let i=x-90;i<x+w+100;i+=54){
      c.beginPath();c.moveTo(i,yy);c.lineTo(i+34,yy);c.lineTo(i+12,yy+stripeH);c.lineTo(i-22,yy+stripeH);c.closePath();c.fill();
    }
  }
  // fit centered title, never cropped
  let size=56;
  c.textAlign='center';c.textBaseline='middle';c.fillStyle='#050505';
  while(size>34){c.font=`950 ${size}px Arial, sans-serif`;if(c.measureText(text).width<=w-170)break;size-=2;}
  c.fillText(text,x+w/2,y+h/2+1);
  c.textAlign='left';c.textBaseline='alphabetic';
  c.restore();
}

function drawSlantedHazard(c,x,y,w,h,text){
  c.save();
  c.translate(x+w/2,y+h/2);c.rotate(-0.07);c.translate(-w/2,-h/2);
  c.fillStyle='#f0c22a';c.fillRect(0,0,w,h);
  c.fillStyle='rgba(0,0,0,.18)';
  for(let i=0;i<1200;i++){if(Math.random()<.08){c.fillRect(Math.random()*w,Math.random()*h,Math.random()*7,Math.random()*5)}}
  c.fillStyle='#050505';
  for(let yy of [0,h-22]){for(let i=-80;i<w+80;i+=48){c.beginPath();c.moveTo(i,yy);c.lineTo(i+30,yy);c.lineTo(i+11,yy+22);c.lineTo(i-19,yy+22);c.closePath();c.fill();}}
  c.fillStyle='#050505';c.font='950 43px Arial, sans-serif';c.textAlign='center';c.fillText(text,w/2,h/2+16);c.textAlign='left';
  c.restore();
}

function splitHeadline(t){
  t=String(t||'你一解释，别人更想撤退');
  const cut=['别人更想撤退','更想撤退','都不敢接话','不敢接话'];
  for(const k of cut){const i=t.indexOf(k);if(i>0)return [t.slice(0,i),t.slice(i)]}

}

function drawHazardPoster(c,x,y,w,h,text){

function imageFromUrl(url,timeout=3500){return new Promise((resolve,reject)=>{const img=new Image();let done=false;const timer=setTimeout(()=>{if(!done){done=true;reject(new Error('image timeout'))}},timeout);img.onload=()=>{if(!done){done=true;clearTimeout(timer);resolve(img)}};img.onerror=()=>{if(!done){done=true;clearTimeout(timer);reject(new Error('image load failed'))}};img.src=url;})}
function imageFromFetch(url,timeout=8000){return new Promise((resolve,reject)=>{const ctrl=new AbortController();const timer=setTimeout(()=>{ctrl.abort();reject(new Error('qr fetch timeout'))},timeout);fetch(url,{cache:'no-store',signal:ctrl.signal}).then(r=>{if(!r.ok)throw new Error('qr http '+r.status);return r.blob()}).then(b=>{const obj=URL.createObjectURL(b);const img=new Image();img.onload=()=>{clearTimeout(timer);URL.revokeObjectURL(obj);resolve(img)};img.onerror=()=>{clearTimeout(timer);URL.revokeObjectURL(obj);reject(new Error('qr object image failed'))};img.src=obj}).catch(e=>{clearTimeout(timer);reject(e)})})}
function drawHazard(c,x,y,w){
  c.save();
  const h=76;
  c.fillStyle='#0a0a08';
  c.fillRect(x,y,w,h);
  c.strokeStyle='rgba(255,209,41,.38)';
  c.lineWidth=2;
  c.beginPath();c.moveTo(x,y+.5);c.lineTo(x+w,y+.5);c.stroke();
  c.beginPath();c.moveTo(x,y+h-.5);c.lineTo(x+w,y+h-.5);c.stroke();
  c.fillStyle='rgba(255,209,41,.9)';
  for(let yy of [y,y+h-10]){
    for(let i=x-52;i<x+w+52;i+=44){
      c.beginPath();c.moveTo(i,yy);c.lineTo(i+24,yy);c.lineTo(i+10,yy+10);c.lineTo(i-14,yy+10);c.closePath();c.fill();
    }
  }
  c.fillStyle='#f2d04b';
  c.font='950 38px Arial';
  c.textAlign='center';
  c.fillText('⚠️ 这句话建议谨慎外放 ⚠️',x+w/2,y+50);
  c.textAlign='left';
  c.restore()
}
function round(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}function wrap(c,text,x,y,max,lh){let line='';for(const ch of text){const test=line+ch;if(c.measureText(test).width>max){c.fillText(line,x,y);line=ch;y+=lh}else line=test}c.fillText(line,x,y);return y}
function shareUrl(){const u=new URL(location.origin+location.pathname);u.searchParams.set('share','1');u.searchParams.set('score',result?.score||$('scoreNum').textContent);u.searchParams.set('type',result?.type||$('typeTag').textContent);u.searchParams.set('quote',result?.quote||$('quoteText').textContent);u.searchParams.set('ings',(result?.ings||[]).join('|'));u.searchParams.set('pcts',(result?.pcts||[]).join('|'));if(serverAudioUrl)u.searchParams.set('audio',serverAudioUrl);else if(audioUrl&&audioUrl.startsWith('/'))u.searchParams.set('audio',audioUrl);return u.toString()}
function loadShare(){const p=new URLSearchParams(location.search);if(p.get('share')==='1'&&p.get('score')){const score=+p.get('score');const fallback=fallbackByScore(score);const r={score,type:p.get('type')||fallback.type,quote:p.get('quote')||fallback.quote,ings:(p.get('ings')?p.get('ings').split('|'):fallback.ings),pcts:(p.get('pcts')?p.get('pcts').split('|'):fallback.pcts)};result=r;$('scoreNum').textContent=score;$('typeTag').textContent=r.type;$('quoteText').textContent=r.quote;$('ingredients').innerHTML=r.ings.map((x,i)=>`<div class="ing"><span>${x}</span><span>${(r.pcts||PCTS[0])[i]||''}</span></div>`).join('');audioUrl=p.get('audio')||'';serverAudioUrl=audioUrl;if(audioUrl)$('audioPlayer').src=audioUrl;document.body.classList.add('shareOnly');show('resultScreen');}}
function bindRecordButton(){
  const btn=$('recordBtn');
  if(!btn)return;
  const begin=(ev)=>{if(ev){ev.preventDefault();ev.stopPropagation();}holdRequested=true;stopRequested=false;startRec();};
  const end=(ev)=>{if(ev){ev.preventDefault();ev.stopPropagation();}holdRequested=false;stopRec();};
  btn.addEventListener('pointerdown',begin,{passive:false});
  btn.addEventListener('pointerup',end,{passive:false});
  btn.addEventListener('pointercancel',end,{passive:false});
  btn.addEventListener('pointerleave',end,{passive:false});
  btn.addEventListener('touchstart',begin,{passive:false});
  btn.addEventListener('touchend',end,{passive:false});
  btn.addEventListener('mousedown',begin);
  btn.addEventListener('mouseup',end);
  // 尝试提前预热麦克风，减少按下后等待导致的漏录
  const warm=()=>prepareMic(true).catch(()=>{});
  window.addEventListener('pointerdown',warm,{once:true,passive:true});
  setTimeout(warm,600);
}

<script>
(function(){
  const qs=new URLSearchParams(location.search);
  const sid=qs.get('sid')||qs.get('id')||'';
  function send(event,data={}){
    try{navigator.sendBeacon&&navigator.sendBeacon('/api/track',new Blob([JSON.stringify({event,data,path:location.pathname,sid})],{type:'application/json'}))||fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event,data,path:location.pathname,sid}),keepalive:true});}catch(e){}
  }
  window.analyticsTrack=send;
  send(qs.get('from')==='share'?'visit_from_share':'page_view',{query:location.search,referrer:document.referrer});
  document.addEventListener('DOMContentLoaded',function(){
    const bind=(id,event)=>{const el=document.getElementById(id); if(el) el.addEventListener('click',()=>send(event,{id}));};
    bind('recordBtn','record_button_click'); bind('rankLink','leaderboard_click'); bind('shareBtn','share_button_click'); bind('copyBtn','copy_link_click'); bind('restartBtn','restart_click');
    const rec=document.getElementById('recordBtn'); if(rec){rec.addEventListener('pointerdown',()=>send('record_start')); rec.addEventListener('pointerup',()=>send('record_stop'));}
  });
})();
</script>
