124px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:linear-gradient(180deg,#1b1b1e,#09090a);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 22px 70px rgba(215,255,63,.15);display:grid;place-items:center;cursor:pointer;touch-action:none;user-select:none;transition:.18s}.mic:active,.mic.recording{transform:scale(.94);box-shadow:0 0 0 12px rgba(255,77,77,.09),0 22px 70px rgba(255,77,77,.28)}.mic svg{width:44px;height:44px;fill:var(--text)}.holdText{font-size:13px;color:var(--muted);margin-top:-4px}.bottomNote{font-size:12px;color:rgba(247,242,234,.42);line-height:1.5;text-align:center}.wave{width:100%;height:118px;border-radius:24px;background:rgba(255,255,255,.04);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:5px;overflow:hidden}.bar{width:5px;border-radius:999px;background:linear-gradient(var(--acid),rgba(215,255,63,.2));animation:wave 1.05s ease-in-out infinite}.bar:nth-child(2n){animation-delay:.13s}.bar:nth-child(3n){animation-delay:.25s}.bar:nth-child(4n){animation-delay:.38s}@keyframes wave{0%,100%{height:18px;opacity:.45}50%{height:82px;opacity:1}}.scanTitle{font-size:32px;font-weight:900;letter-spacing:-.04em;margin:0}.scanLine{height:1px;width:100%;background:linear-gradient(90deg,transparent,var(--acid),transparent);box-shadow:0 0 20px var(--acid);animation:scan 1.7s linear infinite}@keyframes scan{0%{transform:translateY(-70px);opacity:0}20%{opacity:1}100%{transform:translateY(70px);opacity:0}}.steps{width:100%;display:grid;gap:10px}.step{padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.035);color:rgba(247,242,234,.66);font-size:14px}.step.hot{color:var(--text);border-color:rgba(215,255,63,.35);background:rgba(215,255,63,.07)}.resultCard{position:relative;width:100%;border-radius:34px;padding:24px;background:linear-gradient(180deg,rgba(255,255,255,.095),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.13);box-shadow:var(--shadow);overflow:hidden}.resultCard:before{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(215,255,63,.14);filter:blur(22px)}.scoreLabel{font-size:13px;color:var(--muted);letter-spacing:.18em;font-weight:800}.score{font-size:86px;line-height:.95;font-weight:950;letter-spacing:-.08em;margin:6px 0 0}.type{display:inline-flex;align-items:center;gap:8px;margin:14px 0 18px;padding:8px 12px;border-radius:999px;background:rgba(215,255,63,.1);border:1px solid rgba(215,255,63,.25);color:var(--acid);font-size:13px;font-weight:800}.quote{font-size:25px;line-height:1.18;letter-spacing:-.045em;font-weight:900;margin:0 0 18px}.ingredients{display:grid;gap:9px;margin:0 0 20px}.ing{display:flex;justify-content:space-between;gap:12px;padding:13px 14px;border-radius:16px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.07);font-size:14px}.ing span:last-child{color:var(--gold);white-space:nowrap}.audioBox{display:block;padding:12px;border-radius:18px;background:#050505;border:1px solid rgba(255,255,255,.1)}.audioBox audio{display:none}.audioBtn{width:100%;border:0;border-radius:16px;padding:15px 12px;background:var(--acid);color:#080808;font-size:15px;font-weight:950;cursor:pointer}.btn[disabled]{opacity:.58;filter:grayscale(.25);pointer-events:none}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn{border:0;border-radius:18px;padding:15px 14px;font-size:15px;font-weight:900;color:#0b0b0b;background:var(--acid);cursor:pointer}.btn.secondary{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--line)}.btn.full{grid-column:1/-1}.qrCard{display:none;margin-top:12px;align-items:center;gap:12px;border-radius:20px;padding:12px;background:rgba(255,255,255,.055);border:1px solid var(--line)}.qrCard img{width:86px;height:86px;border-radius:14px;background:white}.qrCard p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}.toast{position:absolute;left:18px;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));padding:14px 16px;background:rgba(247,242,234,.94);color:#090909;border-radius:18px;font-weight:800;text-align:center;opacity:0;transform:translateY(12px);transition:.25s;z-index:10}.toast.show{opacity:1;transform:none}.shareOnly .recordOnly{display:none}.shareOnly .screen{padding-top:18px}.miniBack{border:0;background:transparent;color:var(--muted);font-size:13px}.legal{font-size:11px;color:rgba(247,242,234,.34);line-height:1.45;text-align:center;margin-top:10px}@media (max-height:720px){h1{font-size:42px}.micWrap{width:154px;height:154px;margin:8px auto}.mic{width:108px;height:108px}.score{font-size:70px}.quote{font-size:22px}.resultCard{padding:20px;border-radius:28px}.actions{margin-bottom:18px}}

<script>
const $=id=>document.getElementById(id);const screens=['homeScreen','scanScreen','resultScreen'];
const TYPES=[
  '🧊 冷场制造机','📴 群聊终结者','🧯 情绪灭火器','⚡ 隐性放电型','🔪 温柔补刀手','🚫 回复终止型','👀 已读不回触发器','🌫️ 气氛降温器','☣️ 语气污染源','🧪 出口带刺型','🧱 聊天堵墙型','💣 沉默引爆器'
];
const LINES=[
  '你一开口，气氛就凉了','你发完消息，大家都在装没看到','群聊死掉的那一刻，是你说完那句','你说话不是直，是带刺','你一句话，能让空气安静三秒','你嘴上没骂人，但句句都在扎人','你说话像没事，其实每个字都有刺','你一解释，别人更想撤退','你是那种越礼貌，越让人不舒服的人','你一句“随便”，杀伤力比吵架还大','你说完那句，对方已经开始自我反省','你不发火，但你让所有人都不敢接话','你是那种听起来没问题，但哪里都不对的人','你一句话，能让朋友开始怀疑人生','你不是在聊天，你是在释放低浓度毒气','你说话像通知，不像沟通','你一开口，别人就想结束对话','你是那种能把热场聊成冷场的人','你说话没脏字，但杀伤力很脏','你随口一句，别人要消化半天','你不是话少，你是每句都很重','你一认真说话，别人就开始紧张','你一句“没事”，听起来最有事','你说的是事实，但听起来像审判','你说完之后，场面只剩礼貌'
];
const COMPONENTS=[
  '阴阳怪气残留（持续挥发中）','已读不回蒸汽（高温冷处理）','嘴硬保护膜（厚度超标）','礼貌性降温剂（表面文明）','不想解释沉淀物（沉底多年）','被动攻击微粒（肉眼难见）','空气变冷因子（扩散速度快）','轻微翻白眼粉尘（随语气飘散）','不耐烦挥发物（开口即散）','隐藏嫌弃颗粒（浓度稳定）','情绪压缩装置（随时漏气）','冷处理扩散物（半径三米）','社交疲惫气溶胶（吸入即沉默）','选择性耐心残渣（仅对少数人有效）','低频烦躁信号（持续发射）','强忍不爽压缩包（即将解压）','表面平静涂层（内含爆炸物）','内心翻桌粉尘（轻拍即起）','假装配合粉尘（伪装良好）','沉默式反击分子（毒性慢热）','冷笑残留液（附着力极强）','句尾带刺结晶（不易察觉）','好好说话抗体缺失（建议隔离）','群聊退潮素（使热场瞬间降温）','解释越多越毒反应剂（遇水加剧）'
];
const PCTS=[['37%','29%','18%'],['34%','25%','21%'],['31%','27%','19%'],['39%','22%','17%'],['35%','30%','16%']];
let mediaRecorder,chunks=[],audioBlob=null,audioUrl='',result=null,recordStarted=0,isRecording=false,shareId='',shareReady=false,uploadPromise=null;
function show(id){screens.forEach(s=>$(s).classList.toggle('active',s===id))}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2100)}
function seedScore(){return Math.floor(72+Math.random()*21)}
function rand(arr){return arr[Math.floor(Math.random()*arr.length)]}
function sample(arr,n){const copy=[...arr],out=[];while(out.length<n&&copy.length){out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0])}return out}
function generateResult(score){return{score,type:rand(TYPES),quote:rand(LINES),ings:sample(COMPONENTS,3),pcts:rand(PCTS)}}
function fallbackByScore(score){const level=score>=84?'📴 群聊终结者':score>=76?'🧊 冷场制造机':score>=68?'⚡ 隐性放电型':'☣️ 语气污染源';return{score,type:level,quote:rand(LINES),ings:sample(COMPONENTS,3),pcts:rand(PCTS)}}
function makeBars(){let html='';for(let i=0;i<28;i++)html+=`<div class="bar" style="height:${20+Math.random()*70}px"></div>`;$('wave').innerHTML=html}makeBars();
async function startRec(){try{if(isRecording)return;if(!window.isSecureContext){toast('麦克风需要 HTTPS 或 localhost 环境');return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('当前浏览器无法调用麦克风，请换 Chrome/Safari 或确认 HTTPS');return}const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':(MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'');mediaRecorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};mediaRecorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());isRecording=false;finishRec()};recordStarted=Date.now();mediaRecorder.start();isRecording=true;$('recordBtn').classList.add('recording');$('holdText').textContent='正在录音，松手看结果';toast('开始录音了，大胆说')}catch(e){console.error(e);isRecording=false;toast('麦克风没有启动：请允许权限后再试')}}
function stopRec(){if(!mediaRecorder||mediaRecorder.state!=='recording')return;const dur=Date.now()-recordStarted;if(dur<900){setTimeout(stopRec,900-dur);return}mediaRecorder.stop();$('recordBtn').classList.remove('recording');$('holdText').textContent='按住说一句，松手看结果'}
async function finishRec(){audioBlob=new Blob(chunks,{type:'audio/webm'});audioUrl=URL.createObjectURL(audioBlob);show('scanScreen');runScan();let score=seedScore();try{const fd=new FormData();fd.append('audio',audioBlob,'voice.webm');fd.append('sentence','');const res=await fetch('/api/analyze-voice',{method:'POST',body:fd});const data=await res.json();if(data&&data.ok){const len=(data.duration_ms||0);if(len>0)score=Math.min(92,Math.max(72,score+(len>4000?3:0)));}}catch(e){}setTimeout(()=>renderResult(generateResult(score)),1650)}
function runScan(){['s1','s2','s3'].forEach((id,i)=>setTimeout(()=>$(id).classList.add('hot'),i*520));makeBars()}
function renderResult(r){result=r;shareId='';shareReady=false;uploadPromise=null;$('scoreNum').textContent=r.score;$('typeTag').textContent=r.type;$('quoteText').textContent=r.quote;$('ingredients').innerHTML=r.ings.map((x,i)=>`<div class="ing"><span>${x}</span><span>${(r.pcts||PCTS[0])[i]}</span></div>`).join('');const ap=$('audioPlayer');ap.src=audioUrl;ap.load();$('playBtn').textContent='▶ 播放我的原声';show('resultScreen');}

async function ensureShareReady(){
  if(shareId)return shareId;
  if(uploadPromise)return uploadPromise;
  if(!audioBlob){throw new Error('no audio blob')}

function drawFitStrokeFill(c,text,x,y,maxWidth,baseSize,weight='950'){
  text=String(text||'');
  let size=baseSize; const family='Arial, sans-serif';
  while(size>18){c.font=`${weight} ${size}px ${family}`; if(c.measureText(text).width<=maxWidth)break; size-=2;}
  c.strokeText(text,x,y); c.fillText(text,x,y);
}

function posterHeadlineLines(t){
  t=String(t||'你一解释，别人更想撤退').trim();
  const targets=['别人更想撤退','别人就想结束对话','听起来最有事','场面只剩礼貌','所有人都不敢接话','不敢接话','更想撤退','结束对话'];
  for(const k of targets){const i=t.indexOf(k);if(i>0){let a=t.slice(0,i);if(!/[，,。！？!?]$/.test(a))a+='，';return [a,t.slice(i)]}}
  if(t.includes('，')){const a=t.split(/[，,]/);return [a[0]+'，',a.slice(1).join('，')]}
  if(t.length>12)return [t.slice(0,Math.ceil(t.length/2)),t.slice(Math.ceil(t.length/2))];
  return [t,''];
}

function fitText(c,text,x,y,maxWidth,baseSize,weight='950'){
  text=String(text||'');
  let size=baseSize;
  const family='Arial, sans-serif';
  while(size>18){c.font=`${weight} ${size}px ${family}`;if(c.measureText(text).width<=maxWidth)break;size-=2;}
  c.fillText(text,x,y);
}

function drawSlantedHazard(c,x,y,w,h,text){

  for(let yy of [0,h-22]){for(let i=-80;i<w+80;i+=48){c.beginPath();c.moveTo(i,yy);c.lineTo(i+30,yy);c.lineTo(i+11,yy+22);c.lineTo(i-19,yy+22);c.closePath();c.fill();}}
  c.fillStyle='#050505';c.font='950 43px Arial, sans-serif';c.textAlign='center';c.fillText(text,w/2,h/2+16);c.textAlign='left';

}

function splitHeadline(t){

function imageFromUrl(url,timeout=3500){return new Promise((resolve,reject)=>{const img=new Image();let done=false;const timer=setTimeout(()=>{if(!done){done=true;reject(new Error('image timeout'))}},timeout);img.onload=()=>{if(!done){done=true;clearTimeout(timer);resolve(img)}};img.onerror=()=>{if(!done){done=true;clearTimeout(timer);reject(new Error('image load failed'))}};img.src=url;})}
function imageFromFetch(url,timeout=8000){return new Promise((resolve,reject)=>{const ctrl=new AbortController();const timer=setTimeout(()=>{ctrl.abort();reject(new Error('qr fetch timeout'))},timeout);fetch(url,{cache:'no-store',signal:ctrl.signal}).then(r=>{if(!r.ok)throw new Error('qr http '+r.status);return r.blob()}).then(b=>{const obj=URL.createObjectURL(b);const img=new Image();img.onload=()=>{clearTimeout(timer);URL.revokeObjectURL(obj);resolve(img)};img.onerror=()=>{clearTimeout(timer);URL.revokeObjectURL(obj);reject(new Error('qr object image failed'))};img.src=obj}).catch(e=>{clearTimeout(timer);reject(e)})})}

function round(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}function wrap(c,text,x,y,max,lh){let line='';for(const ch of text){const test=line+ch;if(c.measureText(test).width>max){c.fillText(line,x,y);line=ch;y+=lh}else line=test}c.fillText(line,x,y);return y}
