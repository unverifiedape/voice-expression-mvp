<script>
const $=id=>document.getElementById(id);const screens=['homeScreen','scanScreen','resultScreen'];

const COMPONENTS=[
  '阴阳怪气残留（持续挥发中）','已读不回蒸汽（高温冷处理）','嘴硬保护膜（厚度超标）','礼貌性降温剂（表面文明）','不想解释沉淀物（沉底多年）','被动攻击微粒（肉眼难见）','空气变冷因子（扩散速度快）','轻微翻白眼粉尘（随语气飘散）','不耐烦挥发物（开口即散）','隐藏嫌弃颗粒（浓度稳定）','情绪压缩装置（随时漏气）','冷处理扩散物（半径三米）','社交疲惫气溶胶（吸入即沉默）','选择性耐心残渣（仅对少数人有效）','低频烦躁信号（持续发射）','强忍不爽压缩包（即将解压）','表面平静涂层（内含爆炸物）','内心翻桌粉尘（轻拍即起）','假装配合粉尘（伪装良好）','沉默式反击分子（毒性慢热）','冷笑残留液（附着力极强）','句尾带刺结晶（不易察觉）','好好说话抗体缺失（建议隔离）','群聊退潮素（使热场瞬间降温）','解释越多越毒反应剂（遇水加剧）'

const PCTS=[['37%','29%','18%'],['34%','25%','21%'],['31%','27%','19%'],['39%','22%','17%'],['35%','30%','16%']];
let mediaRecorder,chunks=[],audioBlob=null,audioUrl='',serverAudioUrl='',result=null,recordStarted=0,isRecording=false,shareId='',shareReady=false,uploadPromise=null;
let preparedStream=null,preparingMic=null,holdRequested=false,stopRequested=false;

  a.download=filename||'relationshiptest-share-card.png';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1200);
}
function fetchWithTimeout(url,options={},timeout=12000){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),timeout);
  return fetch(url,{...options,signal:ctrl.signal}).finally(()=>clearTimeout(timer));
}
function seedScore(){return Math.floor(72+Math.random()*21)}
function rand(arr){return arr[Math.floor(Math.random()*arr.length)]}
function sample(arr,n){const copy=[...arr],out=[];while(out.length<n&&copy.length){out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0])}return out}
function generateResult(score){return{score,type:rand(TYPES),quote:rand(LINES),ings:sample(COMPONENTS,3),pcts:rand(PCTS)}}
function fallbackByScore(score){const level=score>=84?'📴 群聊终结者':score>=76?'🧊 冷场制造机':score>=68?'⚡ 隐性放电型':'☣️ 语气污染源';return{score,type:level,quote:rand(LINES),ings:sample(COMPONENTS,3),pcts:rand(PCTS)}}
function makeBars(){let html='';for(let i=0;i<28;i++)html+=`<div class="bar" style="height:${20+Math.random()*70}px"></div>`;$('wave').innerHTML=html}makeBars();
async function prepareMic(silent=false){
  if(preparedStream && preparedStream.getAudioTracks().some(t=>t.readyState==='live')) return preparedStream;
  if(preparingMic) return preparingMic;
  if(!window.isSecureContext){ if(!silent) toast('麦克风需要 HTTPS 或 localhost 环境'); throw new Error('insecure context') }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ if(!silent) toast('当前浏览器无法调用麦克风'); throw new Error('no mediaDevices') }
  preparingMic=navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    preparedStream=stream; preparingMic=null; return stream;
  }).catch(e=>{preparingMic=null; if(!silent) toast('请允许麦克风权限后再试'); throw e});
  return preparingMic;
}
async function startRec(){
  try{
    if(isRecording)return;
    stopRequested=false;
    $('recordBtn').classList.add('recording');
    $('holdText').textContent='麦克风启动中，看到提示后再说';

      $('recordBtn').classList.remove('recording');
      $('holdText').textContent='麦克风已准备好，按住再说一句';
      toast('麦克风已准备好，重新按住开始录音');
      return;
    }
    chunks=[];
    const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':(MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'');
    mediaRecorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
    mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    mediaRecorder.onstop=()=>{isRecording=false;finishRec()};
    recordStarted=Date.now();
    mediaRecorder.start(120);
    isRecording=true;
    $('holdText').textContent='正在录音，松手看结果';
    toast('开始录音了，大胆说');
    if(stopRequested) stopRec();
  }catch(e){
    console.error(e);isRecording=false;holdRequested=false;stopRequested=false;
    $('recordBtn').classList.remove('recording');
    $('holdText').textContent='按住说一句，松手看结果';

function stopRec(){
  stopRequested=true;
  if(!mediaRecorder||mediaRecorder.state!=='recording')return;
  const dur=Date.now()-recordStarted;
  if(dur<900){setTimeout(stopRec,900-dur);return}
  try{mediaRecorder.requestData&&mediaRecorder.requestData()}catch(e){}
  mediaRecorder.stop();
  $('recordBtn').classList.remove('recording');
  $('holdText').textContent='按住说一句，松手看结果';
}
async function finishRec(){
  audioBlob=new Blob(chunks,{type:(mediaRecorder&&mediaRecorder.mimeType)||'audio/webm'});
  if(!audioBlob.size){toast('录音太短，请重新按住说一句');return}
  audioUrl=URL.createObjectURL(audioBlob);serverAudioUrl='';
  show('scanScreen');runScan();let score=seedScore();
  try{
    const fd=new FormData();fd.append('audio',audioBlob,'voice.webm');fd.append('sentence','');
    const res=await fetchWithTimeout('/api/analyze-voice',{method:'POST',body:fd},12000);
    const data=await res.json();
    if(data&&data.ok){
      if(data.audio_url) serverAudioUrl=data.audio_url;
      const len=(data.duration_ms||0);if(len>0)score=Math.min(92,Math.max(72,score+(len>4000?3:0)));
    }
  }catch(e){console.warn('analyze failed',e)}

}

function renderResult(r){result=r;shareId='';shareReady=false;uploadPromise=null;$('scoreNum').textContent=r.score;$('typeTag').textContent=r.type;$('quoteText').textContent=r.quote;$('ingredients').innerHTML=r.ings.map((x,i)=>`<div class="ing"><span>${x}</span><span>${(r.pcts||PCTS[0])[i]}</span></div>`).join('');const ap=$('audioPlayer');ap.src=audioUrl;ap.load();$('playBtn').textContent='▶ 播放我的原声';show('resultScreen');}

async function recoverAudioBlob(){
  if(audioBlob&&audioBlob.size)return audioBlob;
  const ap=$('audioPlayer');
  const src=(serverAudioUrl||audioUrl||ap?.currentSrc||ap?.src||'').trim();
  if(!src)return null;
  try{
    const res=await fetchWithTimeout(src,{method:'GET'},10000);
    if(!res.ok)throw new Error('audio fetch failed');
    const b=await res.blob();
    if(b&&b.size){audioBlob=b;return audioBlob}
  }catch(e){console.warn('recover audio failed',e)}
  return null;
}
async function ensureShareReady(options={}){
  const allowNoAudio=!!options.allowNoAudio;
  const allowFallback=options.allowFallback!==false;
  if(shareId)return shareId;
  if(uploadPromise)return uploadPromise;
  await recoverAudioBlob();
  if(!audioBlob){
    if(allowNoAudio){shareReady=false;return ''}
    throw new Error('no audio blob');
  }
  uploadPromise=(async()=>{
    const fd=new FormData();
    fd.append('audio',audioBlob,'voice.webm');
    fd.append('meta',JSON.stringify(result||{}));
    const res=await fetchWithTimeout('/api/upload',{method:'POST',body:fd},15000);
    if(!res.ok)throw new Error('upload failed '+res.status);
    const data=await res.json();
    if(!data.id)throw new Error('missing id');
    shareId=data.id;
    if(data.audio_url) serverAudioUrl=data.audio_url;
    shareReady=true;
    return shareId;
  })();
  try{return await uploadPromise}
  catch(e){
    console.warn('upload share failed, fallback to query share url',e);
    shareReady=false;
    if(allowFallback) return '';
    throw e;
  }finally{uploadPromise=null}
}
function getShareUrl(){
  if(shareId)return `${location.origin}/s.html?id=${encodeURIComponent(shareId)}`;
  return shareUrl();
}

function posterHeadlineLines(t){
  t=String(t||'你一解释，别人更想撤退').trim();
  const targets=['别人更想撤退','别人就想结束对话','听起来最有事','场面只剩礼貌','所有人都不敢接话','不敢接话','更想撤退','结束对话'];
  for(const k of targets){const i=t.indexOf(k);if(i>0){let a=t.slice(0,i);if(!/[，,。！？!?]$/.test(a))a+='，';return [a,t.slice(i)]}}
  if(t.includes('，')){const a=t.split(/[，,]/);return [a[0]+'，',a.slice(1).join('，')]}
  if(t.length>12)return [t.slice(0,Math.ceil(t.length/2)),t.slice(Math.ceil(t.length/2))];
  return [t,''];
}

function fitText(c,text,x,y,maxWidth,baseSize,weight='950'){
  text=String(text||'');
  let size=baseSize;
  const family='Arial, sans-serif';
  while(size>18){c.font=`${weight} ${size}px ${family}`;if(c.measureText(text).width<=maxWidth)break;size-=2;}
  c.fillText(text,x,y);
}


function drawStrongHazardBand(c,x,y,w,h,text){
  c.save();
  // strong reference-2 caution tape, but safe centered text
  c.fillStyle='#f0c22a';c.fillRect(x,y,w,h);
  c.save();c.globalAlpha=.20;c.fillStyle='#050505';
  for(let i=0;i<360;i++){c.fillRect(x+Math.random()*w,y+Math.random()*h,Math.random()*12,Math.random()*5)}
  c.restore();
  c.fillStyle='#050505';
  const stripeH=30;
  for(const yy of [y,y+h-stripeH]){
    for(let i=x-90;i<x+w+100;i+=54){
      c.beginPath();c.moveTo(i,yy);c.lineTo(i+34,yy);c.lineTo(i+12,yy+stripeH);c.lineTo(i-22,yy+stripeH);c.closePath();c.fill();
    }
  }
  // fit centered title, never cropped
  let size=56;
  c.textAlign='center';c.textBaseline='middle';c.fillStyle='#050505';
  while(size>34){c.font=`950 ${size}px Arial, sans-serif`;if(c.measureText(text).width<=w-170)break;size-=2;}
  c.fillText(text,x+w/2,y+h/2+1);

  c.restore();
}

function drawSlantedHazard(c,x,y,w,h,text){

  for(let yy of [0,h-22]){for(let i=-80;i<w+80;i+=48){c.beginPath();c.moveTo(i,yy);c.lineTo(i+30,yy);c.lineTo(i+11,yy+22);c.lineTo(i-19,yy+22);c.closePath();c.fill();}}

function splitHeadline(t){

function imageFromUrl(url,timeout=3500){return new Promise((resolve,reject)=>{const img=new Image();let done=false;const timer=setTimeout(()=>{if(!done){done=true;reject(new Error('image timeout'))}},timeout);img.onload=()=>{if(!done){done=true;clearTimeout(timer);resolve(img)}};img.onerror=()=>{if(!done){done=true;clearTimeout(timer);reject(new Error('image load failed'))}};img.src=url;})}
function imageFromFetch(url,timeout=8000){return new Promise((resolve,reject)=>{const ctrl=new AbortController();const timer=setTimeout(()=>{ctrl.abort();reject(new Error('qr fetch timeout'))},timeout);fetch(url,{cache:'no-store',signal:ctrl.signal}).then(r=>{if(!r.ok)throw new Error('qr http '+r.status);return r.blob()}).then(b=>{const obj=URL.createObjectURL(b);const img=new Image();img.onload=()=>{clearTimeout(timer);URL.revokeObjectURL(obj);resolve(img)};img.onerror=()=>{clearTimeout(timer);URL.revokeObjectURL(obj);reject(new Error('qr object image failed'))};img.src=obj}).catch(e=>{clearTimeout(timer);reject(e)})})}
function drawHazard(c,x,y,w){

function round(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}function wrap(c,text,x,y,max,lh){let line='';for(const ch of text){const test=line+ch;if(c.measureText(test).width>max){c.fillText(line,x,y);line=ch;y+=lh}else line=test}c.fillText(line,x,y);return y}
