<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>语音表达测试 MVP</title>
  <style>
    :root { --bg:#f6f7f5; --card:#fff; --text:#1f2a23; --muted:#6b746d; --line:#dce5de; --accent:#4e6e58; --accent-soft:#eff5f0; --danger:#b54434; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",sans-serif; }
    .wrap { max-width:760px; margin:0 auto; padding:24px 16px 48px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:24px; margin-bottom:20px; }
    h1 { margin:0 0 14px; font-size:28px; line-height:1.2; }
    .desc { color:var(--muted); font-size:15px; line-height:1.8; margin-bottom:20px; }
    .sentence-box { border:1px solid var(--line); border-radius:24px; background:#f7faf7; padding:22px 18px; text-align:center; font-size:28px; margin-bottom:18px; }
    .chips { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:18px; }
    .chip { padding:12px 18px; border:1px solid var(--line); border-radius:999px; background:white; cursor:pointer; font-size:15px; }
    .chip.active { border-color:var(--accent); color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
    .tips { border:1px dashed var(--line); border-radius:18px; padding:16px; color:var(--muted); line-height:1.8; background:#fafcfb; }
    .section-title { font-size:22px; font-weight:700; margin:0 0 18px; }
    .controls { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
    button { border:none; border-radius:18px; padding:18px 28px; font-size:16px; cursor:pointer; }
    .btn-primary { background:var(--accent); color:white; }
    .btn-secondary { background:#f4f4f4; color:#888; }
    .status { font-size:15px; color:var(--muted); margin-bottom:12px; min-height:24px; }
    .error { color:var(--danger); font-size:15px; line-height:1.6; margin-top:12px; white-space:pre-wrap; }
    .result { margin-top:18px; border-top:1px solid var(--line); padding-top:18px; }
    .label { font-size:28px; font-weight:800; margin-bottom:14px; }
    .traits { margin:0; padding-left:20px; line-height:1.9; color:var(--text); }
    .scores { display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; margin-top:18px; }
    .score-card { border:1px solid var(--line); border-radius:16px; padding:14px; background:var(--accent-soft); }
    .score-title { font-size:13px; color:var(--muted); margin-bottom:8px; }
    .score-value { font-size:24px; font-weight:800; }
    audio { width:100%; margin-top:12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>语音表达测试 MVP</h1>
      <div class="desc">读一条固定句子，我们不判断你说了什么内容，只判断你是怎么说出来的。</div>
      <div id="sentenceBox" class="sentence-box">“没关系，你忙你的。”</div>
      <div class="chips">
        <button class="chip active" data-sentence="没关系，你忙你的。">没关系，你忙你的。</button>
        <button class="chip" data-sentence="都行，我无所谓。">都行，我无所谓。</button>
        <button class="chip" data-sentence="你开心就好。">你开心就好。</button>
      </div>
      <div class="tips">建议在安静环境下录音，时长 2–6 秒，完整读出这句话。</div>
    </div>

    <div class="card">
      <div class="section-title">录音</div>
      <div class="controls">
        <button id="startBtn" class="btn-primary">开始录音</button>
        <button id="stopBtn" class="btn-secondary" disabled>停止并分析</button>
      </div>

      <div id="status" class="status">等待录音</div>
      <audio id="audioPlayer" controls style="display:none;"></audio>
      <div id="error" class="error"></div>

      <div id="result" class="result" style="display:none;">
        <div id="resultLabel" class="label"></div>
        <ul id="traits" class="traits"></ul>
        <div class="scores">
          <div class="score-card"><div class="score-title">能量感</div><div id="scoreEnergy" class="score-value">-</div></div>
          <div class="score-card"><div class="score-title">起伏感</div><div id="scoreVariation" class="score-value">-</div></div>
          <div class="score-card"><div class="score-title">停顿感</div><div id="scorePause" class="score-value">-</div></div>
          <div class="score-card"><div class="score-title">锋利感</div><div id="scoreSharpness" class="score-value">-</div></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const sentenceBox = document.getElementById("sentenceBox");
    const chips = document.querySelectorAll(".chip");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const audioPlayer = document.getElementById("audioPlayer");
    const resultEl = document.getElementById("result");
    const resultLabelEl = document.getElementById("resultLabel");
    const traitsEl = document.getElementById("traits");
    const scoreEnergyEl = document.getElementById("scoreEnergy");
    const scoreVariationEl = document.getElementById("scoreVariation");
    const scorePauseEl = document.getElementById("scorePause");
    const scoreSharpnessEl = document.getElementById("scoreSharpness");

    let mediaRecorder = null;
    let mediaStream = null;
    let chunks = [];
    let selectedSentence = "没关系，你忙你的。";

    chips.forEach((chip) => {
      chip.addEventListener("click", () => {
        chips.forEach((c) => c.classList.remove("active"));
        chip.classList.add("active");
        selectedSentence = chip.dataset.sentence;
        sentenceBox.textContent = `“${selectedSentence}”`;
      });
    });

    startBtn.addEventListener("click", async () => {
      errorEl.textContent = "";
      resultEl.style.display = "none";
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = [];
        mediaRecorder = new MediaRecorder(mediaStream);
        mediaRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size > 0) chunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
          try {
            statusEl.textContent = "正在上传并分析...";
            const blob = new Blob(chunks, { type: "audio/webm" });
            const url = URL.createObjectURL(blob);
            audioPlayer.src = url;
            audioPlayer.style.display = "block";

            const formData = new FormData();
            formData.append("file", blob, "recording.webm");
            formData.append("sentence", selectedSentence);

            const resp = await fetch("/api/analyze", { method: "POST", body: formData });
            const data = await resp.json();

            if (!data.ok) throw new Error(data.error || "分析失败");

            const result = data.result;
            resultLabelEl.textContent = result.label;
            traitsEl.innerHTML = "";
            result.traits.forEach((trait) => {
              const li = document.createElement("li");
              li.textContent = trait;
              traitsEl.appendChild(li);
            });

            scoreEnergyEl.textContent = result.scores.energy;
            scoreVariationEl.textContent = result.scores.variation;
            scorePauseEl.textContent = result.scores.pause;
            scoreSharpnessEl.textContent = result.scores.sharpness;

            resultEl.style.display = "block";
            statusEl.textContent = "分析完成";
          } catch (err) {
            statusEl.textContent = "分析失败";
            errorEl.textContent = String(err.message || err);
          } finally {
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            startBtn.disabled = false;
            stopBtn.disabled = true;
          }
        };

        mediaRecorder.start();
        statusEl.textContent = "录音中...";
        startBtn.disabled = true;
        stopBtn.disabled = false;
      } catch (err) {
        errorEl.textContent = "无法打开麦克风，请检查浏览器权限。";
      }
    });

    stopBtn.addEventListener("click", () => {
      if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
      statusEl.textContent = "录音结束，准备分析...";
    });
  </script>
</body>
</html>
