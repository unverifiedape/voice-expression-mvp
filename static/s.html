<!doctype html>
<!-- toxic-voice-v1.6-share-page-20260503 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050505" />
<title>听TA刚刚说的话｜Toxic Voice Test</title>
<style>
:root{--bg:#050505;--text:#f7f2ea;--muted:#8e8a83;--acid:#d7ff3f;--line:rgba(255,255,255,.1);--gold:#ffcf66}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#050505;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",Arial,sans-serif}body{overflow:hidden}.app{position:relative;min-height:100dvh;max-width:520px;margin:0 auto;padding:18px 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;background:radial-gradient(circle at 50% -5%,rgba(215,255,63,.22),transparent 34%),radial-gradient(circle at 10% 92%,rgba(143,216,255,.12),transparent 34%),#050505;overflow:hidden}.grain{pointer-events:none;position:absolute;inset:0;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E")}.top{display:flex;align-items:center;justify-content:space-between;height:42px;z-index:1}.brand{font-size:13px;letter-spacing:.18em;color:rgba(247,242,234,.72);font-weight:800}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:var(--muted);font-size:12px;background:rgba(255,255,255,.035);backdrop-filter:blur(10px)}.hero{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}.badge{font-size:12px;color:#171717;background:var(--acid);border-radius:999px;padding:8px 12px;font-weight:900;box-shadow:0 0 28px rgba(215,255,63,.28)}h1{margin:0;font-size:46px;line-height:.98;letter-spacing:-.06em;font-weight:950}.sub{margin:0;color:rgba(247,242,234,.65);font-size:15px;line-height:1.55}.card{width:100%;border-radius:32px;padding:22px;background:linear-gradient(180deg,rgba(255,255,255,.095),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.13);box-shadow:0 24px 80px rgba(0,0,0,.65);text-align:left}.score{font-size:72px;line-height:.95;font-weight:950;letter-spacing:-.08em}.type{display:inline-flex;margin:10px 0 14px;padding:8px 12px;border-radius:999px;background:rgba(215,255,63,.1);border:1px solid rgba(215,255,63,.25);color:var(--acid);font-size:13px;font-weight:900}.quote{font-size:24px;line-height:1.18;letter-spacing:-.045em;font-weight:900;margin:0 0 16px}.audioWrap{display:grid;gap:10px;padding:12px;border-radius:20px;background:#050505;border:1px solid rgba(255,255,255,.1)}audio{width:100%;height:42px}.tap{width:100%;border:0;border-radius:18px;padding:16px 14px;font-size:16px;font-weight:950;background:var(--acid);color:#0b0b0b}.btn2{width:100%;border:1px solid var(--line);border-radius:18px;padding:15px 14px;font-size:15px;font-weight:900;background:rgba(255,255,255,.08);color:var(--text)}.hint{font-size:12px;color:rgba(247,242,234,.45);line-height:1.45;text-align:center}.loading{color:var(--muted)}.mini{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main class="app">
  <div class="grain"></div>
  <div class="top"><div class="brand">TOXIC VOICE TEST</div><div class="pill">朋友发来的原声</div></div>
  <section class="hero">
    <div class="badge">☣️ 毒气原声已送达</div>
    <h1>听一下<br>TA刚刚说的话</h1>
    <p class="sub">系统说这句话有点毒。<br>你听完，再测测你自己。</p>
    <article class="card">
      <div class="mini">TA的毒气指数</div>
      <div class="score"><span id="score">--</span>%</div>
      <div class="type" id="type">正在读取结果…</div>
      <p class="quote" id="quote">声音加载中</p>
      <div class="audioWrap">
        <button class="tap" id="tapBtn">▶ 点击播放TA的毒气原声</button>
        <audio id="audio" controls playsinline></audio>
      </div>
    </article>
    <button class="tap" id="testBtn">我也测一下</button>
    <button class="btn2" id="copyBtn">复制这个挑战链接</button>
    <p class="hint">娱乐测试，不代表真实人格判断。<br>但朋友可能会觉得很准。</p>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);const p=new URLSearchParams(location.search);const id=p.get('id')||'';
function fallback(){return{score:88,type:'☣️ 毒气样本',quote:'这句话不一定伤人，但很容易让人记住'}}
async function init(){
  if(!id){const f=fallback();render(f);$('quote').textContent='链接缺少声音ID';return}
  try{
    const r=await fetch('/api/share?id='+encodeURIComponent(id),{cache:'no-store'});
    if(!r.ok)throw new Error('not found');
    const data=await r.json();render(data.meta||fallback());
    $('audio').src=data.audio_url||('/api/audio?id='+encodeURIComponent(id));
    setTimeout(()=>{$('audio').play().catch(()=>{})},350);
  }catch(e){render(fallback());$('quote').textContent='这段原声可能已经过期，但你还可以测自己';}
}
function render(m){$('score').textContent=m.score||88;$('type').textContent=m.type||'☣️ 毒气样本';$('quote').textContent=m.quote||'这句话不一定伤人，但很容易让人记住'}
$('tapBtn').onclick=()=>{$('audio').play().catch(()=>{})};
document.body.addEventListener('click',()=>{$('audio').play().catch(()=>{})},{once:true});
$('testBtn').onclick=()=>{location.href='/'};
$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('copyBtn').textContent='已复制，发给朋友'}catch(e){$('copyBtn').textContent='请复制地址栏链接'}};
init();
</script>
</body>
</html>
