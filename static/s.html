<style>

24px 80px rgba(0,0,0,.65);text-align:left}.score{font-size:72px;line-height:.95;font-weight:950;letter-spacing:-.08em}.type{display:inline-flex;margin:10px 0 14px;padding:8px 12px;border-radius:999px;background:rgba(215,255,63,.1);border:1px solid rgba(215,255,63,.25);color:var(--acid);font-size:13px;font-weight:900}.quote{font-size:24px;line-height:1.18;letter-spacing:-.045em;font-weight:900;margin:0 0 16px}.audioWrap{display:grid;gap:10px;padding:12px;border-radius:20px;background:#050505;border:1px solid rgba(255,255,255,.1)}audio{display:none}.tap{width:100%;border:0;border-radius:18px;padding:16px 14px;font-size:16px;font-weight:950;background:var(--acid);color:#0b0b0b}.btn2{width:100%;border:1px solid var(--line);border-radius:18px;padding:15px 14px;font-size:15px;font-weight:900;background:rgba(255,255,255,.08);color:var(--text)}.qrBox{width:100%;display:flex;align-items:center;gap:14px;border:1px solid rgba(255,255,255,.12);border-radius:22px;background:rgba(255,255,255,.055);padding:12px;text-align:left}.qrBox img{width:92px;height:92px;border-radius:16px;background:#fff;padding:7px;object-fit:cover}.qrTitle{font-size:14px;font-weight:900;color:var(--text);margin-bottom:4px}.qrText{font-size:12px;line-height:1.4;color:rgba(247,242,234,.55)}.hint{font-size:12px;color:rgba(247,242,234,.45);line-height:1.45;text-align:center}.loading{color:var(--muted)}.mini{font-size:13px;color:var(--muted)}

.hazardBar{position:relative;z-index:2;margin:0 -18px 12px;height:42px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-top:1px solid rgba(255,209,41,.34);border-bottom:1px solid rgba(255,209,41,.24);box-shadow:0 8px 24px rgba(0,0,0,.32),0 0 18px rgba(215,255,63,.08);background:linear-gradient(180deg,rgba(20,18,10,.96),rgba(6,6,5,.94))}.hazardBar:before,.hazardBar:after{content:"";position:absolute;left:0;right:0;height:5px;background:repeating-linear-gradient(135deg,rgba(255,209,41,.9) 0 12px,rgba(255,209,41,.9) 12px 18px,rgba(5,5,5,.96) 18px 30px,rgba(5,5,5,.96) 30px 36px);opacity:.72}.hazardBar:before{top:0}.hazardBar:after{bottom:0}.hazardBar span{position:relative;z-index:1;color:#f2d04b;font-weight:950;font-size:17px;letter-spacing:.04em;text-shadow:0 0 14px rgba(215,255,63,.12)}.top{height:auto}.hero{padding-top:8px}.scoreLabel{font-size:13px;color:var(--muted)}.app{padding-top:0}@media (max-width:380px){.hazardBar span{font-size:16px}h1{font-size:42px}}

/* V1.7.2 unified share page */
.app{padding-top:18px}
.hero{justify-content:flex-start;padding-top:28px;gap:18px}
.badge{background:rgba(215,255,63,.12);color:var(--acid);border:1px solid rgba(215,255,63,.25);box-shadow:none}
h1{font-size:48px;line-height:.94;text-shadow:0 16px 60px rgba(0,0,0,.7)}
.sub{font-weight:700;color:rgba(247,242,234,.62)}
.card{border-radius:34px}
.tap{border-radius:20px}

</head>
<body>
<main class="app">
  <div class="grain"></div>
  <section class="hero">
    <div class="badge">原声已送达</div>
    <h1>听一下TA说的话<br>哪里不对劲</h1>
    <p class="sub">很多人听完才知道，问题不在内容，在语气。</p>
    <article class="card">
      <div class="mini">TA的伤人指数</div>
      <div class="score"><span id="score">--</span>%</div>
      <div class="type" id="type">正在读取结果…</div>
      <p class="quote" id="quote">声音加载中</p>
      <div class="audioWrap">
        <button class="tap" id="tapBtn">▶ 听听TA到底怎么说的</button>
        <audio id="audio" playsinline></audio>
      </div>
    </article>
    <button class="tap" id="testBtn">我也说一句</button>
    <p class="hint">娱乐测试，不代表真实人格判断。<br>但朋友可能会觉得很准。</p>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);const p=new URLSearchParams(location.search);const id=p.get('id')||'';
function fallback(){return{score:88,type:'☣️ 伤人样本',quote:'这句话不一定很重，但很容易让人不舒服'}}
async function init(){
  if(!id){const f=fallback();render(f);$('quote').textContent='链接缺少声音ID';return}
  try{
    const r=await fetch('/api/share?id='+encodeURIComponent(id),{cache:'no-store'});
    if(!r.ok)throw new Error('not found');
    const data=await r.json();render(data.meta||fallback());
    $('audio').src=data.audio_url||('/api/audio?id='+encodeURIComponent(id));
    
  }catch(e){render(fallback());$('quote').textContent='这段原声可能已经过期，但你还可以测自己';}
}
function render(m){$('score').textContent=m.score||88;$('type').textContent=m.type||'☣️ 伤人样本';$('quote').textContent=m.quote||'这句话不一定很重，但很容易让人不舒服'}
function setBtnIdle(){ $('tapBtn').textContent='▶ 听听TA到底怎么说的'; }
function setBtnPlaying(){ $('tapBtn').textContent='暂停播放'; }
$('tapBtn').onclick=async()=>{
  const a=$('audio');
  if(!a.src){ $('tapBtn').textContent='声音还在加载'; return; }
  if(!a.paused && !a.ended){ a.pause(); setBtnIdle(); return; }
  try{ await a.play(); setBtnPlaying(); }
  catch(e){ $('tapBtn').textContent='请再点一次播放'; }
};
$('audio').addEventListener('play',setBtnPlaying);
$('audio').addEventListener('pause',()=>{ if(!$('audio').ended) setBtnIdle(); });
$('audio').addEventListener('ended',()=>{ $('audio').currentTime=0; setBtnIdle(); });
$('testBtn').onclick=()=>{location.href='/'};

init();
</script>

<script>
(function(){
  const qs=new URLSearchParams(location.search); const sid=qs.get('id')||qs.get('sid')||'';
  function send(event,data={}){try{fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event,data,path:location.pathname,sid}),keepalive:true});}catch(e){}}
  window.analyticsTrack=send;
  send('share_landing',{sid,referrer:document.referrer});
  document.addEventListener('DOMContentLoaded',function(){
    const tap=document.getElementById('tapBtn'); if(tap) tap.addEventListener('click',()=>send('share_audio_play_click',{sid}));
    const test=document.getElementById('testBtn'); if(test) test.addEventListener('click',()=>send('share_to_test_click',{sid}));
  });
})();
</script>

</body>
</html>
