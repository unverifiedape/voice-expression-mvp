<html lang="zh-CN">
<head>

<title>听一下TA说的话，哪里不对劲｜语气有毒，出口伤人</title>
<style>
:root{--bg:#050505;--text:#f7f2ea;--muted:#8e8a83;--acid:#d7ff3f;--line:rgba(255,255,255,.1);--gold:#ffcf66}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#050505;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",Arial,sans-serif}body{overflow:auto}.app{position:relative;min-height:100dvh;max-width:520px;margin:0 auto;padding:18px 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;background:radial-gradient(circle at 50% -5%,rgba(215,255,63,.22),transparent 34%),radial-gradient(circle at 10% 92%,rgba(143,216,255,.12),transparent 34%),#050505;overflow:visible}.grain{pointer-events:none;position:absolute;inset:0;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E")}.top{display:flex;align-items:center;justify-content:space-between;height:42px;z-index:1}.brand{font-size:13px;letter-spacing:.18em;color:rgba(247,242,234,.72);font-weight:800}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:var(--muted);font-size:12px;background:rgba(255,255,255,.035);backdrop-filter:blur(10px)}.hero{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;gap:16px;padding:18px 0 6px}.badge{font-size:12px;color:#171717;background:var(--acid);border-radius:999px;padding:8px 12px;font-weight:900;box-shadow:0 0 28px rgba(215,255,63,.28)}h1{margin:0;font-size:46px;line-height:.98;letter-spacing:-.06em;font-weight:950}.sub{margin:0;color:rgba(247,242,234,.65);font-size:15px;line-height:1.55}.card{width:100%;border-radius:32px;padding:22px;background:linear-gradient(180deg,rgba(255,255,255,.095),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.13);box-shadow:0 24px 80px rgba(0,0,0,.65);text-align:left}.score{font-size:72px;line-height:.95;font-weight:950;letter-spacing:-.08em}.type{display:inline-flex;margin:10px 0 14px;padding:8px 12px;border-radius:999px;background:rgba(215,255,63,.1);border:1px solid rgba(215,255,63,.25);color:var(--acid);font-size:13px;font-weight:900}.quote{font-size:24px;line-height:1.18;letter-spacing:-.045em;font-weight:900;margin:0 0 16px}.audioWrap{display:grid;gap:10px;padding:12px;border-radius:20px;background:#050505;border:1px solid rgba(255,255,255,.1)}audio{display:none}.tap{width:100%;border:0;border-radius:18px;padding:16px 14px;font-size:16px;font-weight:950;background:var(--acid);color:#0b0b0b}.btn2{width:100%;border:1px solid var(--line);border-radius:18px;padding:15px 14px;font-size:15px;font-weight:900;background:rgba(255,255,255,.08);color:var(--text)}.qrBox{width:100%;display:flex;align-items:center;gap:14px;border:1px solid rgba(255,255,255,.12);border-radius:22px;background:rgba(255,255,255,.055);padding:12px;text-align:left}.qrBox img{width:92px;height:92px;border-radius:16px;background:#fff;padding:7px;object-fit:cover}.qrTitle{font-size:14px;font-weight:900;color:var(--text);margin-bottom:4px}.qrText{font-size:12px;line-height:1.4;color:rgba(247,242,234,.55)}.hint{font-size:12px;color:rgba(247,242,234,.45);line-height:1.45;text-align:center}.loading{color:var(--muted)}.mini{font-size:13px;color:var(--muted)}

.hazardBar{position:relative;z-index:2;margin:8px -18px 10px;height:54px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-top:1px solid rgba(255,207,102,.45);border-bottom:1px solid rgba(0,0,0,.85);box-shadow:0 12px 38px rgba(0,0,0,.45),0 0 24px rgba(255,207,102,.12);background:repeating-linear-gradient(135deg,#050505 0 16px,#050505 16px 26px,#ffd129 26px 42px,#ffd129 42px 54px)}.hazardBar:after{content:"";position:absolute;inset:9px 0;background:linear-gradient(90deg,#f0b800,#ffd84a 22%,#ffce1f 50%,#ffd84a 78%,#f0b800);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.32)}.hazardBar span{position:relative;z-index:1;color:#0a0a0a;font-weight:950;font-size:21px;letter-spacing:.02em;text-shadow:0 1px 0 rgba(255,255,255,.25)}.top{height:auto}.hero{padding-top:8px}.scoreLabel{font-size:13px;color:var(--muted)}@media (max-width:380px){.hazardBar span{font-size:19px}h1{font-size:42px}}
</style>
</head>
<body>
<main class="app">
  <div class="grain"></div>
  <div class="hazardBar"><span>⚠️ 语气有毒，出口伤人 ⚠️</span></div>
  <section class="hero">
    <div class="badge">☣️ 毒气原声已送达</div>
    <h1>听一下TA说的话<br>哪里不对劲</h1>
    <p class="sub">很多人听完会不太舒服。<br>你也说一句，看看差别。</p>
    <article class="card">
      <div class="mini">TA的伤人指数</div>
      <div class="score"><span id="score">--</span>%</div>
      <div class="type" id="type">正在读取结果…</div>
      <p class="quote" id="quote">声音加载中</p>
      <div class="audioWrap">
        <button class="tap" id="tapBtn">▶ 点击播放TA的毒气原声</button>
        <audio id="audio" playsinline></audio>
      </div>
    </article>
    <button class="tap" id="testBtn">我也说一句</button>
    <p class="hint">娱乐测试，不代表真实人格判断。<br>但朋友可能会觉得很准。</p>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);const p=new URLSearchParams(location.search);const id=p.get('id')||'';
function fallback(){return{score:88,type:'☣️ 伤人样本',quote:'这句话不一定很重，但很容易让人不舒服'}}
async function init(){
  if(!id){const f=fallback();render(f);$('quote').textContent='链接缺少声音ID';return}
  try{
    const r=await fetch('/api/share?id='+encodeURIComponent(id),{cache:'no-store'});
    if(!r.ok)throw new Error('not found');
    const data=await r.json();render(data.meta||fallback());
    $('audio').src=data.audio_url||('/api/audio?id='+encodeURIComponent(id));
    
  }catch(e){render(fallback());$('quote').textContent='这段原声可能已经过期，但你还可以测自己';}
}
function render(m){$('score').textContent=m.score||88;$('type').textContent=m.type||'☣️ 伤人样本';$('quote').textContent=m.quote||'这句话不一定很重，但很容易让人不舒服'}
function setBtnIdle(){ $('tapBtn').textContent='▶ 点击播放TA的毒气原声'; }
function setBtnPlaying(){ $('tapBtn').textContent='暂停播放'; }
$('tapBtn').onclick=async()=>{
  const a=$('audio');
  if(!a.src){ $('tapBtn').textContent='声音还在加载'; return; }
  if(!a.paused && !a.ended){ a.pause(); setBtnIdle(); return; }
  try{ await a.play(); setBtnPlaying(); }
  catch(e){ $('tapBtn').textContent='请再点一次播放'; }
};
$('audio').addEventListener('play',setBtnPlaying);
$('audio').addEventListener('pause',()=>{ if(!$('audio').ended) setBtnIdle(); });
$('audio').addEventListener('ended',()=>{ $('audio').currentTime=0; setBtnIdle(); });
$('testBtn').onclick=()=>{location.href='/'};

init();
</script>
</body>
</html>
